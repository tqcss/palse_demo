version: 2
updates:
  # Frontend npm dependencies (managed with bun; Dependabot reads package.json).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Workflow action references (checkout, setup-bun, ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
