name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Builds the same bundle CI validated, packages it into Vercel's Build Output
# API (vercel build packages `web/dist` because vercel.json sets
# framework: null) and ships it with `--prebuilt`, so what ships is exactly
# what was built in this run.
#
# Required repo secrets:
#   VERCEL_TOKEN               - Vercel access token (team settings → tokens)
#   VERCEL_ORG_ID              - from `vercel link` (web/.vercel/project.json)
#   VERCEL_PROJECT_ID          - from `vercel link` (web/.vercel/project.json)
#   SUPABASE_URL               - Project URL (public-safe, VITE_ embedded)
#   SUPABASE_PUBLISHABLE_KEY   - publishable key (public-safe, VITE_ embedded)
#   TURNSTILE_SITE_KEY         - may be empty while Turnstile is deferred
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Build frontend
        run: bun run build
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

      - name: Link Vercel project
        run: npx --yes vercel@latest link --yes
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Package build output
        run: npx --yes vercel@latest build --token "$VERCEL_TOKEN"
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        run: npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
