name: CI
on:
  push:
    branches: [main]
  pull_request:

# Frontend quality gate: matches the local check set exactly.
# examples/ and supabase/ are intentionally not built or linted here —
# examples/ is a static design reference and schema.sql is applied manually.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Typecheck
        run: bunx tsc -b
        working-directory: web

      - name: Lint
        run: bunx oxlint src
        working-directory: web

      - name: Build
        run: bun run build
        working-directory: web
